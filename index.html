<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bill Splitter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h1>Bill Splitter & Tip Calculator</h1>

        <label for="bill">Total Bill ($)</label>
        <input type="number" id="bill" placeholder="0.00" min="0" step="0.01">

        <label for="tip">Tip (%)</label>
        <input type="number" id="tip" placeholder="10" min="0">

        <label for="people">Number of People</label>
        <input type="number" id="people" placeholder="1" min="1">

        <button id="calc">Calculate</button>
        <p id="error"></p>

        <div class="result">
            <div class="row">
                <span>Tip per person</span>
                <span id="tipEach">$0.00</span>
            </div>
            <div class="row">
                <span>Total per person</span>
                <span id="totalEach">$0.00</span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
