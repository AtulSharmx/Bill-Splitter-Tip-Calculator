<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Bill Splitter & Tip Calculator</title>
    <meta name="description" content="Calculate and split your restaurant bill and tips instantly among friends with this easy-to-use calculator.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="calculator-container">
        <section class="calculator-card">
            <h1>Bill Splitter & Tip Calculator</h1>
            
            <div class="input-group">
                <label for="bill-amount">Total Bill ($)</label>
                <input type="number" id="bill-amount" placeholder="Enter bill amount" min="0" step="0.01">
            </div>
            
            <div class="input-group">
                <label for="tip-percentage">Tip Percentage (%)</label>
                <input type="number" id="tip-percentage" placeholder="Enter tip percentage" min="0" step="1">
            </div>
            
            <div class="input-group">
                <label for="people-count">Number of People</label>
                <input type="number" id="people-count" placeholder="How many people?" min="0" step="1">
            </div>
            
            <button id="calculate-btn">Calculate Split</button>
            
            <div id="error-message" class="error-msg"></div>
            
            <div class="results-section">
                <div class="result-row">
                    <span>Tip Per Person:</span>
                    <span id="tip-per-person">$0.00</span>
                </div>
                <div class="result-row">
                    <span>Total Per Person:</span>
                    <span id="total-per-person">$0.00</span>
                </div>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
